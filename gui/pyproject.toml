[project]
name = "gui"
version = "0.1.0"
description = "UART telemetry dashboard and recorder for a thrust stand"
readme = "README.md"
authors = [
    { name = "Zaraius", email = "zaraiusbillimoria@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
]

[project.scripts]
gui = "gui:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
